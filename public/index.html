<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Arena</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <div class="brand">Pulse Arena</div>
    <div class="stats">
      <div><strong>Move:</strong> WASD / Arrow keys</div>
      <div><strong>Phase Dash:</strong> Space (burns charge)</div>
      <div><strong>Goal:</strong> Collect energy, bump rivals, stay in control</div>
    </div>
    <div class="status">
      <div id="player-name"></div>
      <div id="latency"></div>
    </div>
    <div id="scoreboard"></div>
  </div>
  <canvas id="arena"></canvas>
  <script src="client.js"></script>
</body>
</html>
